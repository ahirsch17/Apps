name: Grade build

on:
  push:
    paths:
      - "Grade/**"
      - ".github/workflows/grade.yml"
  pull_request:
    paths:
      - "Grade/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Grade
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project Grade.xcodeproj \
            -target Grade \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*(deprecated|will be an error)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
