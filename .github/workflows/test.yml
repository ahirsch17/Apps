name: Between tests

on:
  push:
    paths:
      - 'Between/**'
  pull_request:
    paths:
      - 'Between/**'

jobs:
  seed-and-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Between
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python seed tests
        run: python Scripts/test_seed_data.py
      - name: Node API tests
        run: |
          cd api
          npm ci
          npm test
