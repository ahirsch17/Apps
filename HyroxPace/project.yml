name: HyroxPace
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "9.0"
settings:
  base:
    DEVELOPMENT_TEAM: SPDTT4AL46
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  HyroxPace:
    type: application
    platform: iOS
    sources:
      - path: HyroxPaceiOS
        excludes:
          - Info.plist
    dependencies:
      - target: HyroxPaceWatch
    info:
      path: HyroxPaceiOS/Info.plist
      properties:
        CFBundleDisplayName: HyroxPace
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hirschengineering.hyroxpace
        PRODUCT_NAME: HyroxPace
        DEVELOPMENT_TEAM: SPDTT4AL46
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HyroxPaceWatch:
    type: application
    platform: watchOS
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: HyroxPace
        excludes:
          - "**/*.md"
          - Info.plist
    info:
      path: HyroxPace/Info.plist
      properties:
        CFBundleDisplayName: HyroxPace
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.hirschengineering.hyroxpace
        WKRunsIndependentlyOfCompanionApp: true
        NSHealthShareUsageDescription: HyroxPace starts a workout session so the screen can stay on during your race. Heart rate and GPS are not used.
        NSHealthUpdateUsageDescription: HyroxPace starts a workout session so the screen can stay on during your race. Heart rate and GPS are not used.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hirschengineering.hyroxpace.watch
        PRODUCT_NAME: HyroxPaceWatch
        DEVELOPMENT_TEAM: SPDTT4AL46
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: HyroxPace/HyroxPace.entitlements
        TARGETED_DEVICE_FAMILY: 4
        SDKROOT: watchos
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
schemes:
  HyroxPace:
    build:
      targets:
        HyroxPace: all
        HyroxPaceWatch: all
    run:
      config: Debug
    archive:
      config: Release
  HyroxPaceWatch:
    build:
      targets:
        HyroxPaceWatch: all
    run:
      config: Debug
