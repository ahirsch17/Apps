name: Sparq
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
targets:
  Sparq:
    type: application
    platform: iOS
    sources:
      - path: Sparq
        excludes:
          - docs/**
          - "**/*.md"
    resources:
      - path: Sparq/Resources
      - path: Sparq/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhirsch.sparq
        PRODUCT_NAME: Sparq
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Sparq
        DEVELOPMENT_TEAM: SPDTT4AL46
    scheme:
      testTargets: []
