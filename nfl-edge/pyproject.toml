[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-edge"
version = "0.1.0"
description = "NFL DraftKings edge finder: model fair prices vs DK lines for spreads, totals, props, and SGPs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nflreadpy>=0.1.0",
  "polars>=1.0.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "streamlit>=1.32.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
nfl-edge = "nfl_edge.cli:app"
sports-edge = "nfl_edge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
